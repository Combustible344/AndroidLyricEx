plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

// 签名配置从本地 keystore.properties 读取 (不进入版本库)
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    signingConfigs {
        release_config {
            if (keystoreProps.getProperty('storeFile') != null) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    namespace 'com.example.pra'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.pra"
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // R8 裁剪 + 资源收缩: 主力瘦身手段 (图标库 45 MB、未用依赖全部剔除)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 本地没有 keystore.properties 时退回 debug 签名, 方便直接装机验证 release 包;
            // 有正式 keystore 时仍使用 release_config
            signingConfig keystoreProps.getProperty('storeFile') != null
                    ? signingConfigs.release_config
                    : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
    testOptions {
        // JVM 单元测试中 Android stub 类 (Log/Canvas 等) 返回默认值而非抛异常
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.ui.graphics
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
    implementation(libs.androidx.compose.material.icons.extended)

    // Media3 (ExoPlayer) - 使用 def 定义变量
    def media3Version = "1.2.0"

    implementation "androidx.media3:media3-exoplayer:$media3Version" // 核心播放器
